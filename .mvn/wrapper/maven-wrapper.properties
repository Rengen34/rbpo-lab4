# maven-wrapper.properties: задаёт проверяемую версию Maven для Windows и Unix.
# Методов и формул нет; вход — запуск mvnw, выход — Maven 3.9.16.
# Зависимость — Maven Central; побочный эффект — загрузка в локальный кэш.
# Диагностика — сообщения mvnw; тест — mvnw -version; описание — README.md.
# maven-wrapper.properties: версия сгенерированных официальных скриптов.
wrapperVersion=3.3.4
# maven-wrapper.properties: скрипты скачивают Maven без дополнительного jar.
distributionType=only-script
# maven-wrapper.properties: URL официального артефакта из Maven Central.
distributionUrl=https://repo.maven.apache.org/maven2/org/apache/maven/apache-maven/3.9.16/apache-maven-3.9.16-bin.zip
# maven-wrapper.properties: SHA-256 архива, сверенного с SHA-512 Apache.
distributionSha256Sum=5af3b743dd8b876b5c45da33b676251e5f1687712644abb4ee519ca56e1d89ce
